name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two concurrent applies corrupt the state. The S3 lock would block the second
# one, but with an error; this queue resolves it before that.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.6"
  AWS_REGION: us-east-1

jobs:
  apply:
    name: Aplicar infraestrutura
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Conferir credencial
        run: |
          aws sts get-caller-identity > /dev/null 2>&1 || {
            echo "::error::Credencial da AWS ausente ou expirada. As do Learner Lab duram ~4h; rode ./scripts/refresh-aws-secrets.sh"
            exit 1
          }

      - name: terraform init
        run: terraform init -input=false

      - name: terraform apply
        run: terraform apply -auto-approve -input=false -no-color

      # A green apply with a resource in an invalid state is a false positive:
      # apply reports "created", not "working".
      - name: Verify the instance is available
        run: |
          status=$(aws rds describe-db-instances \
            --db-instance-identifier car-repair-shop-db \
            --query 'DBInstances[0].DBInstanceStatus' --output text)
          echo "status=$status"
          [ "$status" = "available" ] || { echo "::error::RDS em $status, esperado available"; exit 1; }

      - name: Verify the database is not internet-facing
        run: |
          public=$(aws rds describe-db-instances \
            --db-instance-identifier car-repair-shop-db \
            --query 'DBInstances[0].PubliclyAccessible' --output text)
          [ "$public" = "False" ] || { echo "::error::RDS is marked as publicly accessible"; exit 1; }
          echo "publicly_accessible=$public"

      - name: Summary
        run: |
          {
            echo "### Infrastructure applied"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Endpoint | \`$(terraform output -raw db_endpoint)\` |"
            echo "| Port | $(terraform output -raw db_port) |"
            echo "| Database | $(terraform output -raw db_name) |"
            echo "| Password at | \`$(terraform output -raw db_password_parameter)\` |"
            echo ""
            echo "Approximate cost while up: **USD 0.43/day**."
            echo "To tear down: the **Destroy** workflow, or \`./scripts/teardown.sh\`."
          } >> "$GITHUB_STEP_SUMMARY"
