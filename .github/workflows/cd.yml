name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Dois applies simultaneos corrompem o estado. A trava do S3 barraria o
# segundo, mas com erro; esta fila resolve antes de chegar la.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.6"
  AWS_REGION: us-east-1

jobs:
  apply:
    name: Aplicar infraestrutura
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Conferir credencial
        run: |
          aws sts get-caller-identity > /dev/null 2>&1 || {
            echo "::error::Credencial da AWS ausente ou expirada. As do Learner Lab duram ~4h; rode ./scripts/refresh-aws-secrets.sh"
            exit 1
          }

      - name: terraform init
        run: terraform init -input=false

      - name: terraform apply
        run: terraform apply -auto-approve -input=false -no-color

      # Apply verde com recurso em estado invalido e falso positivo: o apply
      # responde "criei", nao "esta funcionando".
      - name: Verificar que a instancia esta disponivel
        run: |
          status=$(aws rds describe-db-instances \
            --db-instance-identifier car-repair-shop-db \
            --query 'DBInstances[0].DBInstanceStatus' --output text)
          echo "status=$status"
          [ "$status" = "available" ] || { echo "::error::RDS em $status, esperado available"; exit 1; }

      - name: Verificar que o banco nao esta exposto na internet
        run: |
          public=$(aws rds describe-db-instances \
            --db-instance-identifier car-repair-shop-db \
            --query 'DBInstances[0].PubliclyAccessible' --output text)
          [ "$public" = "False" ] || { echo "::error::RDS marcado como publicamente acessivel"; exit 1; }
          echo "publicly_accessible=$public"

      - name: Resumo
        run: |
          {
            echo "### Infraestrutura aplicada"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Endpoint | \`$(terraform output -raw db_endpoint)\` |"
            echo "| Porta | $(terraform output -raw db_port) |"
            echo "| Banco | $(terraform output -raw db_name) |"
            echo "| Senha em | \`$(terraform output -raw db_password_parameter)\` |"
            echo ""
            echo "Custo aproximado enquanto estiver de pe: **USD 0,43/dia**."
            echo "Para derrubar: workflow **Destroy**, ou \`./scripts/teardown.sh\`."
          } >> "$GITHUB_STEP_SUMMARY"
